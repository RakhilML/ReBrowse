name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,mcp]"
          python -m playwright install --with-deps chromium
      - run: ruff check rebrowse tests
      - run: pytest -q
