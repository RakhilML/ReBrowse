# No license: all rights reserved.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebrowse"
version = "0.1.0"
description = "Local API reverse-engineering for browsers: capture traffic, extract hidden APIs, replay them safely."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "certifi",
    "playwright>=1.45.0",
    "pydantic>=2.8.0",
    "click>=8.1.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
# DSPy is optional — the LLM client falls back to raw prompts without it.
dspy = ["dspy>=2.5.0"]
# The MCP server (`rebrowse mcp`) needs fastmcp; core CLI does not.
mcp = ["fastmcp>=2.14"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16",
]

[project.scripts]
rebrowse = "rebrowse.cli:main"

[tool.setuptools.packages.find]
include = ["rebrowse*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
